# XcodeGen project description. Generate the Xcode project with:
#   cd ios && xcodegen generate && open Errand.xcodeproj
name: Errand
options:
  bundleIdPrefix: com.abdulrafay
  deploymentTarget:
    iOS: "17.0"
packages:
  ErrandKit:
    path: ErrandKit
targets:
  Errand:
    type: application
    platform: iOS
    sources:
      - Errand
    dependencies:
      - package: ErrandKit
        product: ErrandKit
      - package: ErrandKit
        product: ErrandUI
    info:
      path: Errand/Info.plist
      properties:
        CFBundleDisplayName: Errand
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Errand uses the camera to scan the pairing code shown on your Mac.
        NSFaceIDUsageDescription: Errand uses Face ID so only you can control your Mac from this phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulrafay.errand
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
